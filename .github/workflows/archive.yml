name: Daily Archive
on:
  schedule:
    - cron: '55 21 * * *'   # 00:55 بتوقيت مكة تقريبًا (21:55 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python .github/archive.py
      - name: Commit archive
        run: |
          git config user.name "archive-bot"
          git config user.email "bot@users.noreply.github.com"
          git add archive.json
          git diff --staged --quiet || git commit -m "archive: $(date -u +%F)"
          git push
