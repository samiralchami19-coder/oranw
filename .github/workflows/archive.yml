name: Daily Archive
on:
  schedule:
    - cron: '55 0,6,12,18 * * *'   # كل 6 ساعات (4 لقطات يوميًا)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python .github/archive.py
      - run: python .github/build_pages.py
      - name: Commit archive
        run: |
          git config user.name "archive-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "archive: $(date -u +%F)"
          git push
